<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="commBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF6E5" />
      <stop offset="100%" stop-color="#F2E6C8" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#commBg)" rx="16" />
  
  <!-- Glowing circle background -->
  <circle cx="300" cy="180" r="110" fill="#DFF0E5" opacity="0.7" />
  
  <!-- Central community group / figures -->
  <!-- Center figure -->
  <circle cx="300" cy="130" r="24" fill="#246B45" />
  <path d="M 265 230 C 265 180, 335 180, 335 230 Z" fill="#246B45" />
  
  <!-- Left figure -->
  <circle cx="225" cy="150" r="20" fill="#E59A18" />
  <path d="M 195 235 C 195 195, 255 195, 255 235 Z" fill="#E59A18" />
  
  <!-- Right figure -->
  <circle cx="375" cy="150" r="20" fill="#1A4F33" />
  <path d="M 345 235 C 345 195, 405 195, 405 235 Z" fill="#1A4F33" />
  
  <!-- Connecting hands / arch of solidarity -->
  <path d="M 180 240 Q 300 280 420 240" fill="none" stroke="#246B45" stroke-width="4" stroke-linecap="round" />
  
  <!-- Heart icon representing care and empathy -->
  <path d="M 300 172 C 300 162, 288 152, 278 162 C 268 172, 300 196, 300 196 C 300 196, 332 172, 322 162 C 312 152, 300 162, 300 172 Z" fill="#F4C84B" />
  
  <!-- Trees / Greenery -->
  <path d="M 130 250 L 145 215 L 160 250 Z" fill="#246B45" opacity="0.5" />
  <path d="M 440 250 L 455 215 L 470 250 Z" fill="#246B45" opacity="0.5" />
  
  <!-- Badge -->
  <rect x="180" y="330" width="240" height="34" rx="17" fill="#246B45" />
  <text x="300" y="352" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Community &amp; Social Development</text>
</svg>
