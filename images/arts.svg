<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="artBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8E8" />
      <stop offset="100%" stop-color="#F8EDC9" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#artBg)" rx="16" />
  
  <!-- Artist Palette -->
  <path d="M 360 120 C 440 140, 440 230, 370 260 C 330 275, 270 280, 230 240 C 190 200, 200 130, 270 110 C 310 100, 330 110, 360 120 Z" fill="#FFFFFF" stroke="#246B45" stroke-width="4" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.06))" />
  
  <!-- Thumb Hole -->
  <circle cx="360" cy="225" r="14" fill="#F8EDC9" stroke="#246B45" stroke-width="2" />
  
  <!-- Paint Blobs -->
  <circle cx="260" cy="140" r="14" fill="#246B45" />
  <circle cx="310" cy="135" r="14" fill="#F4C84B" />
  <circle cx="360" cy="155" r="14" fill="#E55838" />
  <circle cx="240" cy="180" r="14" fill="#3B82F6" />
  <circle cx="250" cy="225" r="14" fill="#8B5CF6" />
  
  <!-- Paintbrush -->
  <g transform="rotate(35 320 200)">
    <!-- Handle -->
    <polygon points="315,70 325,70 322,230 318,230" fill="#8A6805" />
    <!-- Ferrule -->
    <rect x="314" y="60" width="12" height="20" fill="#CCCCCC" />
    <!-- Bristles & Tip -->
    <path d="M 314 60 C 314 40, 326 40, 326 60 Z" fill="#246B45" />
  </g>
  
  <!-- Badge -->
  <rect x="200" y="330" width="200" height="34" rx="17" fill="#246B45" />
  <text x="300" y="352" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Arts, Expression &amp; Culture</text>
</svg>
