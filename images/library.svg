<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="libBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF3EE" />
      <stop offset="100%" stop-color="#D7E8DE" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#libBg)" rx="16" />
  
  <!-- Bookshelf Base -->
  <rect x="150" y="240" width="300" height="12" rx="4" fill="#1A4F33" />
  
  <!-- Stack of Books on Shelf -->
  <!-- Book 1 -->
  <rect x="180" y="140" width="28" height="100" rx="3" fill="#246B45" />
  <rect x="185" y="150" width="18" height="80" fill="#DFF0E5" opacity="0.4" />
  
  <!-- Book 2 (Tilted) -->
  <g transform="rotate(12 225 240)">
    <rect x="220" y="145" width="26" height="95" rx="3" fill="#F4C84B" />
    <line x1="233" y1="160" x2="233" y2="225" stroke="#17221B" stroke-width="2" opacity="0.3" />
  </g>
  
  <!-- Book 3 & 4 -->
  <rect x="260" y="130" width="32" height="110" rx="3" fill="#1A4F33" />
  <rect x="296" y="150" width="24" height="90" rx="3" fill="#E59A18" />
  <rect x="324" y="125" width="35" height="115" rx="3" fill="#246B45" />
  
  <!-- Book 5, 6, 7 -->
  <rect x="363" y="155" width="26" height="85" rx="3" fill="#DFF0E5" stroke="#246B45" stroke-width="2" />
  <rect x="393" y="140" width="30" height="100" rx="3" fill="#F4C84B" />
  
  <!-- Reading glasses -->
  <circle cx="270" cy="275" r="16" fill="none" stroke="#246B45" stroke-width="3" />
  <circle cx="310" cy="275" r="16" fill="none" stroke="#246B45" stroke-width="3" />
  <line x1="286" y1="275" x2="294" y2="275" stroke="#246B45" stroke-width="3" />
  <line x1="254" y1="275" x2="240" y2="265" stroke="#246B45" stroke-width="3" stroke-linecap="round" />
  <line x1="326" y1="275" x2="340" y2="265" stroke="#246B45" stroke-width="3" stroke-linecap="round" />

  <!-- Badge -->
  <rect x="190" y="330" width="220" height="34" rx="17" fill="#246B45" />
  <text x="300" y="352" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Grantha Mitra &amp; Libraries</text>
</svg>
