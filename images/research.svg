<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="resBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF5F0" />
      <stop offset="100%" stop-color="#D4ECE0" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#resBg)" rx="16" />
  
  <!-- Analytics Chart Board -->
  <rect x="140" y="90" width="320" height="200" rx="12" fill="#FFFFFF" stroke="#246B45" stroke-width="3" filter="drop-shadow(0 8px 16px rgba(23,34,27,0.08))" />
  
  <!-- Grid Lines -->
  <line x1="180" y1="140" x2="420" y2="140" stroke="#E0ECE4" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="180" y1="190" x2="420" y2="190" stroke="#E0ECE4" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="180" y1="240" x2="420" y2="240" stroke="#E0ECE4" stroke-width="1.5" />
  
  <!-- Bar 1 -->
  <rect x="200" y="180" width="28" height="60" rx="4" fill="#DFF0E5" stroke="#246B45" stroke-width="2" />
  <!-- Bar 2 -->
  <rect x="250" y="150" width="28" height="90" rx="4" fill="#F4C84B" />
  <!-- Bar 3 -->
  <rect x="300" y="125" width="28" height="115" rx="4" fill="#246B45" />
  <!-- Bar 4 -->
  <rect x="350" y="105" width="28" height="135" rx="4" fill="#1A4F33" />
  
  <!-- Trend Line with Dots -->
  <path d="M 214 170 L 264 140 L 314 115 L 364 95" fill="none" stroke="#E55838" stroke-width="3" stroke-linecap="round" />
  <circle cx="214" cy="170" r="5" fill="#E55838" />
  <circle cx="264" cy="140" r="5" fill="#E55838" />
  <circle cx="314" cy="115" r="5" fill="#E55838" />
  <circle cx="364" cy="95" r="5" fill="#E55838" />
  
  <!-- Badge -->
  <rect x="180" y="330" width="240" height="34" rx="17" fill="#246B45" />
  <text x="300" y="352" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Research, Data &amp; Impact</text>
</svg>
