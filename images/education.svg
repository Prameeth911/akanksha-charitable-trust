<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="eduBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFF0E5" />
      <stop offset="100%" stop-color="#C5E3CF" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#246B45" />
      <stop offset="100%" stop-color="#1A4F33" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4C84B" />
      <stop offset="100%" stop-color="#E5B738" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="600" height="400" fill="url(#eduBg)" rx="16" />
  
  <!-- Subtle decorative circles -->
  <circle cx="500" cy="80" r="60" fill="#246B45" opacity="0.08" />
  <circle cx="80" cy="320" r="70" fill="#F4C84B" opacity="0.15" />
  
  <!-- Glowing Sun / Light of Education -->
  <circle cx="300" cy="140" r="50" fill="url(#goldGrad)" opacity="0.9" />
  
  <!-- Open Book Base -->
  <path d="M 160 280 C 230 260, 280 275, 300 290 C 320 275, 370 260, 440 280 L 440 220 C 370 200, 320 215, 300 230 C 280 215, 230 200, 160 220 Z" fill="#FFFFFF" filter="drop-shadow(0 8px 12px rgba(23,34,27,0.1))" />
  
  <!-- Book Cover & Spine -->
  <path d="M 155 285 C 230 265, 280 280, 300 295 C 320 280, 370 265, 445 285 L 440 280 C 370 260, 320 275, 300 290 C 280 275, 230 260, 160 280 Z" fill="url(#bookGrad)" />
  
  <!-- Book Lines -->
  <line x1="200" y1="240" x2="270" y2="250" stroke="#246B45" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <line x1="200" y1="255" x2="260" y2="263" stroke="#246B45" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <line x1="330" y1="250" x2="400" y2="240" stroke="#246B45" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <line x1="340" y1="263" x2="400" y2="255" stroke="#246B45" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  
  <!-- Plant Sprout emerging from Book (Growth & Learning) -->
  <path d="M 300 230 Q 300 170 300 150" stroke="#246B45" stroke-width="5" stroke-linecap="round" fill="none" />
  <!-- Left Leaf -->
  <path d="M 300 180 C 260 170, 260 140, 300 160" fill="#246B45" />
  <!-- Right Leaf -->
  <path d="M 300 165 C 340 150, 340 125, 300 145" fill="#246B45" />
  
  <!-- Sparkles / Stars of Innovation -->
  <polygon points="300,105 304,115 315,119 304,123 300,133 296,123 285,119 296,115" fill="#F4C84B" />
  <polygon points="210,130 212,137 219,139 212,141 210,148 208,141 201,139 208,137" fill="#246B45" />
  <polygon points="390,130 392,137 399,139 392,141 390,148 388,141 381,139 388,137" fill="#246B45" />

  <!-- Badge Text -->
  <rect x="210" y="330" width="180" height="34" rx="17" fill="#246B45" />
  <text x="300" y="352" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Foundational Learning</text>
</svg>
